<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SoloGoal — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red: #c0392b; --red-dark: #922b21;
    --bg: #1e1e1e; --card: #242424; --line: #2e2e2e;
    --text: #e8e8e8; --muted: #666; --sub: #aaa;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Sarabun', 'Inter', sans-serif;
    min-height: 100vh; padding-bottom: 3rem;
  }
  a { color: inherit; text-decoration: none; }

  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 14px 1.5rem; display: flex; align-items: center;
    justify-content: space-between; position: sticky; top: 0; z-index: 10;
  }
  .logo-wordmark { font-size: 18px; font-weight: 700; color: #fff; }
  .badge-role {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: var(--red); color: #fff; margin-left: 10px; vertical-align: middle;
  }

  .container { max-width: 720px; margin: 0 auto; padding: 1.5rem; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
  }

  .staff-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--line);
    gap: 12px; flex-wrap: wrap;
  }
  .staff-row:last-child { border-bottom: none; }
  .staff-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .staff-info { display: flex; flex-direction: column; gap: 2px; }
  .staff-username { font-size: 15px; font-weight: 600; color: #fff; }
  .staff-email { font-size: 12px; color: var(--muted); }
  .staff-role-tag {
    display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 4px;
    margin-top: 2px; width: fit-content;
  }
  .staff-role-tag.webmaster { background: rgba(192,57,43,0.15); color: #e74c3c; }
  .staff-role-tag.admin { background: rgba(255,255,255,0.08); color: var(--sub); }

  .btn {
    padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
    border: none; cursor: pointer; font-family: inherit; transition: background 0.15s;
  }
  .btn-red { background: var(--red); color: #fff; }
  .btn-red:hover { background: var(--red-dark); }
  .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--sub); }
  .btn-outline:hover { border-color: var(--red); color: #fff; }

  .section-title { font-size: 13px; color: var(--muted); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }

  .denied {
    text-align: center; padding: 4rem 1rem; color: var(--sub);
  }
  .denied .icon { font-size: 48px; margin-bottom: 1rem; }
  .loading { text-align: center; padding: 3rem; color: var(--muted); }
  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--line);
    border-top-color: var(--red); border-radius: 50%;
    animation: spin 0.7s linear infinite; margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; z-index: 100; padding: 1rem;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 1.5rem; width: 100%; max-width: 360px;
  }
  .modal-box h3 { font-size: 16px; margin-bottom: 4px; color: #fff; }
  .modal-box .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 1rem; }
  .modal-box input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: #1a1a1a; color: var(--text); font-family: inherit; font-size: 14px; margin-bottom: 0.75rem;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 0.5rem; }
  .modal-actions .btn { flex: 1; }
  .btn-cancel { background: transparent; border: 1px solid var(--line); color: var(--sub); }
  .modal-msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .modal-msg.error { color: #e74c3c; }
  .modal-msg.success { color: #2ecc71; }
</style>
</head>
<body>

<header>
  <a href="/" class="logo-wordmark">SoloGoal <span class="badge-role" id="role-badge" style="display:none;"></span></a>
  <button class="btn btn-outline" id="logout-btn" style="display:none;" onclick="handleLogout()">ออกจากระบบ</button>
</header>

<div class="container" id="main-container">
  <div class="loading"><div class="spinner"></div>กำลังตรวจสอบสิทธิ์...</div>
</div>

<div class="modal-overlay" id="reset-modal">
  <div class="modal-box">
    <h3>ตั้งรหัสผ่านใหม่</h3>
    <div class="modal-sub" id="reset-target-label"></div>
    <input type="password" id="new-password-input" placeholder="รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)"/>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeResetModal()">ยกเลิก</button>
      <button class="btn btn-red" onclick="submitReset()">ยืนยัน</button>
    </div>
    <div class="modal-msg" id="reset-msg"></div>
  </div>
</div>

<div class="modal-overlay" id="rename-modal">
  <div class="modal-box">
    <h3>เปลี่ยนชื่อผู้ใช้</h3>
    <div class="modal-sub" id="rename-target-label"></div>
    <input type="text" id="new-username-input" placeholder="ชื่อใหม่ (2-20 ตัวอักษร)"/>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeRenameModal()">ยกเลิก</button>
      <button class="btn btn-red" onclick="submitRename()">ยืนยัน</button>
    </div>
    <div class="modal-msg" id="rename-msg"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://dnrcardbuuwnvuridubb.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_uz4Tj8HDZef7T2OLEzyvUw_wcGsn0ZW'
  const { createClient } = supabase
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY)

  let currentSession = null
  let currentTargetUserId = null
  let currentTargetLabel = ''

  async function init() {
    const { data: { session } } = await sb.auth.getSession()
    currentSession = session

    if (!session) {
      window.location.href = '/auth.html?tab=login'
      return
    }

    // เช็คสิทธิ์ผ่าน edge function (ตัวเดียวกับที่ดึงรายชื่อ staff)
    // เพราะ column "role" ถูกปิดไม่ให้ query ตรงจาก client แล้ว เพื่อความปลอดภัย
    await loadStaffList()
  }

  function renderDenied() {
    document.getElementById('main-container').innerHTML = `
      <div class="denied">
        <div class="icon">🔒</div>
        <div style="font-size:18px;font-weight:600;color:#fff;margin-bottom:8px;">ไม่มีสิทธิ์เข้าถึงหน้านี้</div>
        <div style="font-size:13px;">หน้านี้สำหรับ Webmaster เท่านั้น</div>
      </div>
    `
  }

  async function loadStaffList() {
    let staff, error
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-list-staff`, {
        headers: { 'Authorization': `Bearer ${currentSession.access_token}` },
      })
      const data = await res.json()
      if (!res.ok) { error = data.error; } else { staff = data.staff }
    } catch (e) {
      error = String(e)
    }

    if (error || !staff) {
      renderDenied()
      return
    }

    const badge = document.getElementById('role-badge')
    badge.textContent = 'WEBMASTER'
    badge.style.display = 'inline-block'
    document.getElementById('logout-btn').style.display = 'inline-block'

    const others = staff.filter(s => s.user_id !== currentSession.user.id)

    let html = `
      <div class="card">
        <div class="section-title">รีเซ็ตรหัสผ่านทีมงาน (Webmaster เท่านั้น)</div>
        <div id="staff-list"></div>
      </div>
    `
    document.getElementById('main-container').innerHTML = html

    const listEl = document.getElementById('staff-list')
    if (!others.length) {
      listEl.innerHTML = '<div style="color:var(--muted);font-size:13px;">ไม่มีบัญชีทีมงานอื่น</div>'
      return
    }

    listEl.innerHTML = others.map(s => `
      <div class="staff-row">
        <div class="staff-info">
          <div class="staff-username">${escapeHtml(s.username || '(ไม่มีชื่อ)')}</div>
          <div class="staff-email">${escapeHtml(s.email || '')}</div>
          <span class="staff-role-tag ${s.role}">${s.role === 'webmaster' ? 'WEBMASTER' : 'ADMIN'}</span>
        </div>
        <div class="staff-actions">
          <button class="btn btn-outline" onclick="openRenameModal('${s.user_id}', '${escapeHtml(s.username || '')}')">เปลี่ยนชื่อ</button>
          <button class="btn btn-red" onclick="openResetModal('${s.user_id}', '${escapeHtml(s.username || s.email)}')">รีเซ็ตรหัสผ่าน</button>
        </div>
      </div>
    `).join('')
  }

  function escapeHtml(str) {
    const div = document.createElement('div')
    div.textContent = str
    return div.innerHTML
  }

  function openResetModal(userId, label) {
    currentTargetUserId = userId
    currentTargetLabel = label
    document.getElementById('reset-target-label').textContent = `สำหรับบัญชี: ${label}`
    document.getElementById('new-password-input').value = ''
    document.getElementById('reset-msg').textContent = ''
    document.getElementById('reset-modal').classList.add('open')
  }

  function closeResetModal() {
    document.getElementById('reset-modal').classList.remove('open')
  }

  async function submitReset() {
    const newPassword = document.getElementById('new-password-input').value
    const msgEl = document.getElementById('reset-msg')

    if (!newPassword || newPassword.length < 8) {
      msgEl.textContent = 'รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร'
      msgEl.className = 'modal-msg error'
      return
    }

    msgEl.textContent = 'กำลังดำเนินการ...'
    msgEl.className = 'modal-msg'

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-reset-password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${currentSession.access_token}`,
        },
        body: JSON.stringify({
          target_user_id: currentTargetUserId,
          new_password: newPassword,
        }),
      })
      const data = await res.json()

      if (!res.ok) {
        msgEl.textContent = data.error || 'เกิดข้อผิดพลาด'
        msgEl.className = 'modal-msg error'
        return
      }

      msgEl.textContent = `ตั้งรหัสผ่านใหม่สำเร็จสำหรับ ${currentTargetLabel}`
      msgEl.className = 'modal-msg success'
      setTimeout(closeResetModal, 1500)
    } catch (e) {
      msgEl.textContent = 'เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง'
      msgEl.className = 'modal-msg error'
    }
  }

  let currentRenameUserId = null

  function openRenameModal(userId, currentUsername) {
    currentRenameUserId = userId
    document.getElementById('rename-target-label').textContent = `ชื่อปัจจุบัน: ${currentUsername}`
    document.getElementById('new-username-input').value = ''
    document.getElementById('rename-msg').textContent = ''
    document.getElementById('rename-modal').classList.add('open')
  }

  function closeRenameModal() {
    document.getElementById('rename-modal').classList.remove('open')
  }

  async function submitRename() {
    const newUsername = document.getElementById('new-username-input').value.trim()
    const msgEl = document.getElementById('rename-msg')

    if (newUsername.length < 2 || newUsername.length > 20) {
      msgEl.textContent = 'ชื่อต้องยาว 2-20 ตัวอักษร'
      msgEl.className = 'modal-msg error'
      return
    }

    msgEl.textContent = 'กำลังดำเนินการ...'
    msgEl.className = 'modal-msg'

    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-update-username`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${currentSession.access_token}`,
        },
        body: JSON.stringify({
          target_user_id: currentRenameUserId,
          new_username: newUsername,
        }),
      })
      const data = await res.json()

      if (!res.ok) {
        msgEl.textContent = data.error || 'เกิดข้อผิดพลาด'
        msgEl.className = 'modal-msg error'
        return
      }

      msgEl.textContent = 'เปลี่ยนชื่อสำเร็จ'
      msgEl.className = 'modal-msg success'
      setTimeout(() => {
        closeRenameModal()
        loadStaffList()
      }, 1000)
    } catch (e) {
      msgEl.textContent = 'เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง'
      msgEl.className = 'modal-msg error'
    }
  }

  async function handleLogout() {
    await sb.auth.signOut()
    window.location.href = '/auth.html?tab=login'
  }

  init()
</script>
</body>
</html>
